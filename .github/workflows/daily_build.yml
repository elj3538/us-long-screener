name: Daily US Long Screener Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily_build.yml"
  schedule:
    # 米国市場クローズ後（毎日 UTC 22:30 = 日本時間 翌朝 7:30）に自動実行
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      limit:
        description: "テスト用銘柄数制限（空欄でS&P500全銘柄）"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener pipeline
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            python main.py --no-cache --workers 3 --limit "${{ github.event.inputs.limit }}"
          else
            python main.py --no-cache --workers 3
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
